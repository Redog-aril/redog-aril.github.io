<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudo da Bacia Hidrográfica</title>
<link rel="stylesheet" href="imagem.jpg">
 
<style>
/* =========================================================
   1. VARIÁVEIS VISUAIS — ALTERE AQUI CORES, FONTE E BORDAS
   ========================================================= */
:root{
  --cor-principal:#1d5c4a;   /* verde mata: títulos, botões, destaques */
  --cor-secundaria:#26708f;  /* azul rio: detalhes, linha do tempo */
  --cor-fundo:#f3f6f4;
  --cor-texto:#17302b;
  --cor-card:#ffffff;
  --cor-suave:#e3ede8;       /* fundos de apoio */
  --cor-borda:#d3e0da;
  --cor-apoio:#546a63;       /* textos secundários */
  --fonte:'Literata',Georgia,serif;              /* textos e títulos */
  --fonte-ui:'Work Sans',system-ui,sans-serif;   /* menu, botões, tabelas */
  --raio:12px;
  --sombra:0 1px 2px rgba(23,48,43,.06),0 6px 18px rgba(23,48,43,.07);
  --largura-menu:272px;
}

/* =========================================================
   2. ESTILOS DOS COMPONENTES (normalmente não precisa editar)
   ========================================================= */
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{font-family:var(--fonte);font-size:1.0625rem;line-height:1.75;background:var(--cor-fundo);color:var(--cor-texto);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
h1,h2,h3{line-height:1.2;letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--cor-secundaria);outline-offset:2px}

/* progresso e voltar ao topo */
#progresso{position:fixed;top:0;left:0;height:4px;width:0;background:var(--cor-secundaria);z-index:70}
#subir{position:fixed;right:20px;bottom:20px;width:46px;height:46px;border:0;border-radius:50%;background:var(--cor-principal);color:#fff;font-size:1.2rem;cursor:pointer;box-shadow:var(--sombra);opacity:0;pointer-events:none;transition:opacity .3s;z-index:55}
#subir.on{opacity:1;pointer-events:auto}

/* menu lateral */
#menu{position:fixed;top:0;bottom:0;left:0;width:var(--largura-menu);padding:32px 18px;overflow:auto;background:var(--cor-card);border-right:1px solid var(--cor-borda);font-family:var(--fonte-ui);z-index:60;transition:transform .3s}
.marca{font:700 1.1rem/1.3 var(--fonte);margin:0 12px 22px}
#menu-links a{display:block;padding:9px 12px;margin-bottom:2px;border-left:3px solid transparent;border-radius:0 8px 8px 0;color:var(--cor-apoio);font-size:.92rem;line-height:1.4;text-decoration:none;transition:background .2s}
#menu-links a:hover{background:var(--cor-suave)}
#menu-links a.ativo{background:var(--cor-suave);border-left-color:var(--cor-principal);color:var(--cor-principal);font-weight:600}
#menu-links b{font-weight:600;margin-right:.35em;opacity:.7}
#barra,#veu{display:none}
main,footer{margin-left:var(--largura-menu)}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center;min-height:100vh;max-width:1180px;margin:0 auto;padding:64px clamp(20px,5vw,64px)}
.hero>*{animation:entrada .8s both}
.hero>:last-child{animation-delay:.2s}
@keyframes entrada{from{opacity:0;transform:translateY(14px)}}
.hero h1{font-size:clamp(2.4rem,5.2vw,4.2rem);margin-bottom:16px;color:var(--cor-principal)}
.hero .sub{font-size:1.25rem;font-weight:600;margin-bottom:12px}
.hero .desc{max-width:48ch;color:var(--cor-apoio)}
.btn{display:inline-block;margin-top:32px;padding:14px 26px;border-radius:var(--raio);background:var(--cor-principal);color:#fff;font:600 .95rem var(--fonte-ui);text-decoration:none;transition:background .2s}
.btn:hover{background:var(--cor-secundaria)}

/* seções */
.cap{max-width:1040px;margin:0 auto;padding:88px clamp(20px,5vw,64px) 8px}
.cap:last-of-type{padding-bottom:96px}
.cap h2{font-size:clamp(1.8rem,3.4vw,2.6rem);color:var(--cor-principal);margin-bottom:12px}
.intro{max-width:62ch;margin-bottom:40px;font-size:1.2rem;color:var(--cor-apoio)}
.bloco{margin-bottom:48px}
.texto p{max-width:68ch;margin-bottom:1.1em}
.sep{display:block;width:min(70%,420px);margin:40px auto 0;color:var(--cor-secundaria);opacity:.6}

/* imagens */
.moldura{border-radius:var(--raio);overflow:hidden;background:var(--cor-suave);box-shadow:var(--sombra)}
.moldura img,.moldura .ph{width:100%;height:100%;object-fit:cover}
.ph{display:grid;place-items:center;min-height:180px;padding:16px;border:2px dashed var(--cor-borda);border-radius:var(--raio);color:var(--cor-apoio);font:500 .85rem var(--fonte-ui);text-align:center}
.alto{aspect-ratio:4/5}
.largo{aspect-ratio:21/9}
figcaption{padding:8px 2px 0;color:var(--cor-apoio);font:.82rem var(--fonte-ui)}

/* layouts e componentes */
.dividido{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.dividido.inv figure{order:2}
.dividido .moldura{aspect-ratio:4/3}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
.card{padding:24px;background:var(--cor-card);border:1px solid var(--cor-borda);border-radius:var(--raio);box-shadow:var(--sombra)}
.card h3{margin-bottom:8px;font-size:1.15rem}
.card p,.card li{color:var(--cor-apoio);font-size:.97rem}
.card ul{padding-left:1.1em}
.com-img{padding:0;overflow:hidden}
.com-img .moldura{border-radius:0;box-shadow:none;aspect-ratio:16/10}
.corpo{padding:20px 24px 24px}
.fato{border-top:4px solid var(--cor-secundaria)}
.fato strong{display:block;margin-bottom:6px;color:var(--cor-secundaria);font-family:var(--fonte-ui)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.duo .card{border-top:4px solid var(--cor-principal)}
.duo .card+.card{border-top-color:var(--cor-secundaria)}
.linha{margin-left:8px;padding-left:28px;border-left:2px solid var(--cor-borda)}
.marco{position:relative;padding-bottom:28px}
.marco::before{content:"";position:absolute;left:-36px;top:7px;width:14px;height:14px;border-radius:50%;border:3px solid var(--cor-secundaria);background:var(--cor-fundo)}
.marco time{color:var(--cor-secundaria);font:600 .9rem var(--fonte-ui)}
.marco h3{font-size:1.15rem}
.marco p{max-width:60ch;color:var(--cor-apoio)}
.caract{display:grid;gap:12px;list-style:none;padding:0}
.caract li{padding:14px 18px 14px 20px;background:var(--cor-card);border:1px solid var(--cor-borda);border-left:4px solid var(--cor-principal);border-radius:var(--raio)}
.caract strong{font-family:var(--fonte-ui)}
.galeria{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.galeria .moldura{aspect-ratio:4/3}
blockquote{max-width:60ch;padding:6px 0 6px 24px;border-left:4px solid var(--cor-secundaria);font-size:1.3rem;font-style:italic}
cite{display:block;margin-top:8px;color:var(--cor-apoio);font:normal .9rem var(--fonte-ui)}
.destaque{padding:22px 26px;background:var(--cor-suave);border-left:5px solid var(--cor-principal);border-radius:var(--raio)}
.destaque strong{display:block;color:var(--cor-principal);font-family:var(--fonte-ui)}
.destaque.sabia{border-left-color:var(--cor-secundaria)}
.destaque.sabia strong{color:var(--cor-secundaria)}
.passos{counter-reset:p;display:grid;gap:14px;list-style:none;padding:0}
.passos li{counter-increment:p;display:flex;gap:16px;align-items:flex-start}
.passos li::before{content:counter(p);flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--cor-principal);color:#fff;font:600 .95rem var(--fonte-ui)}
.tabela{overflow:auto;border-radius:var(--raio);box-shadow:var(--sombra)}
table{width:100%;border-collapse:collapse;background:var(--cor-card);font:.93rem var(--fonte-ui)}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--cor-borda)}
th{background:var(--cor-principal);color:#fff;font-weight:600}
details{margin-bottom:10px;padding:16px 20px;background:var(--cor-card);border:1px solid var(--cor-borda);border-radius:var(--raio)}
summary{cursor:pointer;font:600 1rem var(--fonte-ui)}
details[open] summary{margin-bottom:8px;color:var(--cor-principal)}
details p{color:var(--cor-apoio)}

/* rodapé */
footer{padding:56px clamp(20px,5vw,64px);background:var(--cor-principal);color:#e9f3ef;font:.92rem/1.7 var(--fonte-ui)}
footer>div{max-width:1040px;margin:0 auto}
footer h3{margin-bottom:8px;color:#fff;font:700 1.2rem var(--fonte)}
footer h4{margin:20px 0 6px;color:#fff;font-size:.95rem}
footer ol{padding-left:1.2em}

/* celular e tablet */
@media(max-width:900px){
  html{scroll-padding-top:72px}
  #barra{display:flex;position:fixed;top:0;left:0;right:0;height:56px;align-items:center;gap:12px;padding:0 12px;background:var(--cor-card);border-bottom:1px solid var(--cor-borda);font:600 .95rem var(--fonte-ui);z-index:65}
  #burger{width:40px;height:40px;border:1px solid var(--cor-borda);border-radius:8px;background:none;color:inherit;font-size:1.3rem;cursor:pointer}
  #menu{top:56px;transform:translateX(-100%);box-shadow:var(--sombra)}
  #menu.aberto{transform:none}
  #veu.on{display:block;position:fixed;inset:56px 0 0;background:rgba(0,0,0,.35);z-index:58}
  main,footer{margin-left:0}
  main{padding-top:56px}
  .hero{grid-template-columns:1fr;gap:32px;min-height:auto;padding-top:48px}
  .alto{aspect-ratio:16/10}
  .dividido,.duo{grid-template-columns:1fr}
  .dividido.inv figure{order:0}
}
@media(max-width:480px){#menu{width:86vw}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="progresso"></div>
<div id="barra"><button id="burger" aria-label="Abrir ou fechar o menu" aria-expanded="false" aria-controls="menu">☰</button><span id="barra-titulo"></span></div>
<div id="veu"></div>
<nav id="menu" aria-label="Navegação principal"><p class="marca" id="marca"></p><div id="menu-links"></div></nav>
<main id="conteudo"></main>
<footer id="rodape"></footer>
<button id="subir" aria-label="Voltar ao topo">↑</button>

/* ===========================================================
   PARTE 2 — COMPONENTES (não precisa editar)
   =========================================================== */
const L = (a, f) => a.map(f).join("");
const $ = s => document.querySelector(s);
const ph = () => `<div class="ph">[URL DA IMAGEM]</div>`;
const img = (s, alt = "", c = "") => `<div class="moldura ${c}">${s && s[0] !== "[" ? `<img src="${s}" alt="${alt}" loading="lazy" onerror="this.outerHTML='<div class=ph>Imagem não encontrada</div>'">` : ph()}</div>`;
const fig = (s, leg = "", c = "") => `<figure>${img(s, leg, c)}${leg ? `<figcaption>${leg}</figcaption>` : ""}</figure>`;

const COMP = {
  texto: b => `<div class="texto">${L(b.paragrafos, p => `<p>${p}</p>`)}</div>`,
  dividido: b => `<div class="dividido${b.lado === "direita" ? " inv" : ""}">${fig(b.img, b.legenda)}${COMP.texto(b)}</div>`,
  banner: b => fig(b.img, b.legenda, "largo"),
  cards: b => `<div class="grade">${L(b.itens, i => `<article class="card"><h3>${i.titulo}</h3><p>${i.texto}</p></article>`)}</div>`,
  cardsImg: b => `<div class="grade">${L(b.itens, i => `<article class="card com-img">${fig(i.img, i.legenda || "", "")}<div class="corpo"><h3>${i.titulo}</h3><p>${i.texto}</p></div></article>`)}</div>`,
  timeline: b => `<div class="linha">${L(b.itens, i => `<div class="marco"><time>${i.data}</time><h3>${i.titulo}</h3><p>${i.texto}</p></div>`)}</div>`,
  comparacao: b => `<div class="duo">${L([b.a, b.b], x => `<div class="card"><h3>${x.titulo}</h3><ul>${L(x.pontos, p => `<li>${p}</li>`)}</ul></div>`)}</div>`,
  caracteristicas: b => `<ul class="caract">${L(b.itens, i => `<li><strong>${i.titulo}</strong><br>${i.texto}</li>`)}</ul>`,
  galeria: b => `<div class="galeria">${L(b.itens, i => fig(i.img, i.legenda))}</div>`,
  citacao: b => `<blockquote>${b.texto}<cite>${b.autor}</cite></blockquote>`,
  destaque: b => `<aside class="destaque ${b.variante || ""}"><strong>${b.rotulo}</strong>${b.texto}</aside>`,
  passos: b => `<ol class="passos">${L(b.itens, i => `<li>${i}</li>`)}</ol>`,
  tabela: b => `<div class="tabela"><table><thead><tr>${L(b.cab, c => `<th>${c}</th>`)}</tr></thead><tbody>${L(b.linhas, l => `<tr>${L(l, c => `<td>${c}</td>`)}</tr>`)}</tbody></table></div>`,
  faq: b => L(b.itens, i => `<details><summary>${i.p}</summary><p>${i.r}</p></details>`),
  curiosidades: b => `<div class="grade">${L(b.itens, t => `<div class="card fato"><strong>Você sabia?</strong><p>${t}</p></div>`)}</div>`
};

const SEP = `<svg class="sep" viewBox="0 0 520 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M0 12C43-2 87-2 130 12S217 26 260 12 347-2 390 12 477 26 520 12"/></svg>`;

document.title = HERO.titulo;
$("#marca").textContent = $("#barra-titulo").textContent = HERO.marca;
$("#menu-links").innerHTML = `<a href="#inicio" class="ativo">Início</a>` +
  L(SECOES, (s, i) => `<a href="#${s.id}"><b>${String(i + 1).padStart(2, "0")} —</b>${s.menu}</a>`);
$("#conteudo").innerHTML =
  `<header class="hero" id="inicio"><div><h1>${HERO.titulo}</h1><p class="sub">${HERO.subtitulo}</p><p class="desc">${HERO.descricao}</p><a class="btn" href="#${SECOES[0].id}">${HERO.botao}</a></div>${fig(HERO.img, HERO.legenda, "alto")}</header>` +
  SECOES.map(s => `<section class="cap" id="${s.id}"><h2>${s.titulo}</h2><p class="intro">${s.intro}</p>${L(s.blocos, b => `<div class="bloco">${COMP[b.tipo](b)}</div>`)}</section>`).join(SEP);
$("#rodape").innerHTML = `<div><h3>${RODAPE.trabalho}</h3><p>${RODAPE.alunos}<br>${L(RODAPE.autores,  r => `<ol>${r}</ol>`)}<br>${RODAPE.profe}<br>${RODAPE.instituicao}<br>${RODAPE.ano}</p><h4>Referências</h4><ol>${L(RODAPE.referencias, r => `<li>${r}</li>`)}</ol></div>`;

/* ===========================================================
   PARTE 3 — COMPORTAMENTO
   =========================================================== */
const links = [...document.querySelectorAll("#menu-links a")];
const spy = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(a => a.classList.toggle("ativo", a.hash === "#" + e.target.id));
}), { rootMargin: "-35% 0px -60% 0px" });
["inicio", ...SECOES.map(s => s.id)].forEach(id => spy.observe(document.getElementById(id)));

addEventListener("scroll", () => {
  const h = document.documentElement;
  $("#progresso").style.width = (scrollY / (h.scrollHeight - innerHeight)) * 100 + "%";
  $("#subir").classList.toggle("on", scrollY > 600);
}, { passive: true });
$("#subir").onclick = () => scrollTo({ top: 0, behavior: "smooth" });

const abrir = o => {
  $("#menu").classList.toggle("aberto", o);
  $("#veu").classList.toggle("on", o);
  $("#burger").setAttribute("aria-expanded", o);
};
$("#burger").onclick = () => abrir(!$("#menu").classList.contains("aberto"));
$("#veu").onclick = () => abrir(false);
$("#menu-links").onclick = e => { if (e.target.closest("a")) abrir(false); };
addEventListener("keydown", e => e.key === "Escape" && abrir(false));
</script>
